interface:
  display_name: "Business Analysis"
  short_description: "Turn salon requests into product-grade requirements"
  default_prompt: "Use $business-analysis to turn this request into workflow, requirements, acceptance criteria, product-grade edge cases, idempotency, duplicate prevention, service-understanding ownership, scope boundaries, and open questions. Return a clear listing with conclusion, work type, evidence, product driver, numbered requirements/plan, scope/non-goals, checks, and approval gate when implementation is implied."
policy:
  allow_implicit_invocation: true
