name: ${COMPOSE_PROJECT_NAME:-manleai}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-720}
      TOKEN_ENCRYPTION_KEY_BASE64: ${TOKEN_ENCRYPTION_KEY_BASE64:?TOKEN_ENCRYPTION_KEY_BASE64 is required}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ai.knasoftware.com,https://salon.knasoftware.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://ai.knasoftware.com}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-production}
      SQUARE_CLIENT_ID: ${SQUARE_CLIENT_ID:-}
      SQUARE_CLIENT_SECRET: ${SQUARE_CLIENT_SECRET:-}
      SQUARE_REDIRECT_URL: ${SQUARE_REDIRECT_URL:-https://ai.knasoftware.com/api/integrations/square/callback}
      SQUARE_API_VERSION: ${SQUARE_API_VERSION:-2026-05-20}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-twilio}
      VOICE_PUBLIC_BASE_URL: ${VOICE_PUBLIC_BASE_URL:-https://ai.knasoftware.com}
      VOICE_TWILIO_AUTH_TOKEN: ${VOICE_TWILIO_AUTH_TOKEN:-}
      VOICE_TWILIO_INCOMING_PATH: ${VOICE_TWILIO_INCOMING_PATH:-/api/voice/twilio/incoming}
      VOICE_TWILIO_TURN_PATH: ${VOICE_TWILIO_TURN_PATH:-/api/voice/twilio/turn}
      VOICE_TWILIO_RECORDING_PATH: ${VOICE_TWILIO_RECORDING_PATH:-/api/voice/twilio/recording}
      VOICE_AI_PROVIDER: ${VOICE_AI_PROVIDER:-}
      VOICE_OPENAI_API_KEY: ${VOICE_OPENAI_API_KEY:-}
      VOICE_OPENAI_BASE_URL: ${VOICE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VOICE_OPENAI_TRANSCRIPTION_MODEL: ${VOICE_OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      VOICE_OPENAI_REPLY_MODEL: ${VOICE_OPENAI_REPLY_MODEL:-gpt-4.1-mini}
      VOICE_OPENAI_SPEECH_MODEL: ${VOICE_OPENAI_SPEECH_MODEL:-gpt-4o-mini-tts}
      VOICE_OPENAI_SPEECH_VOICE: ${VOICE_OPENAI_SPEECH_VOICE:-alloy}
    expose:
      - "8080"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ai.knasoftware.com}
        NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ai.knasoftware.com}
      NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
    expose:
      - "3000"
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-13088}:3000"
    networks:
      - app

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      LANDING_API_BASE_URL: ${LANDING_API_BASE_URL:-http://api:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ai.knasoftware.com}
    expose:
      - "3000"
    ports:
      - "${LANDING_BIND_HOST:-127.0.0.1}:${LANDING_PORT:-13090}:3000"
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
