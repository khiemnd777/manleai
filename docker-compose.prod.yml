name: ${COMPOSE_PROJECT_NAME:-manleai}

x-backend-runtime-environment: &backend_runtime_environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must use the non-owner runtime role}
  DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
  DATABASE_RLS_ENFORCED: "true"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-X-ManleAI-Client-IP}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
  REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-720}
  TOKEN_ENCRYPTION_KEY_BASE64: ${TOKEN_ENCRYPTION_KEY_BASE64:?TOKEN_ENCRYPTION_KEY_BASE64 is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://platform.knasoftware.com,https://ai.knasoftware.com,https://salon.knasoftware.com,https://pos.knasoftware.com}
  FRONTEND_URL: ${FRONTEND_URL:-https://platform.knasoftware.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  api:
    image: ${IMAGE_REPOSITORY:-manleai}/manleai-api:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
      labels:
        org.opencontainers.image.source: ${IMAGE_SOURCE_URL:-https://github.com/khiemnd777/manleai}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend_runtime_environment
      SERVER_PORT: 8080
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must use the migration owner role}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    expose:
      - "8080"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  worker:
    image: ${IMAGE_REPOSITORY:-manleai}/manleai-worker:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
      labels:
        org.opencontainers.image.source: ${IMAGE_SOURCE_URL:-https://github.com/khiemnd777/manleai}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend_runtime_environment
      SERVER_PORT: 8080
      AUTO_MIGRATE: "false"
    networks:
      - app

  frontend:
    image: ${IMAGE_REPOSITORY:-manleai}/manleai-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
        NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
      labels:
        org.opencontainers.image.source: ${IMAGE_SOURCE_URL:-https://github.com/khiemnd777/manleai}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
      NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
    expose:
      - "3000"
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-13088}:3000"
    networks:
      - app

  landing:
    image: ${IMAGE_REPOSITORY:-manleai}/manleai-landing:${IMAGE_TAG:-local}
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
        NEXT_PUBLIC_MARKETING_BASE_URL: ${NEXT_PUBLIC_MARKETING_BASE_URL:-https://ai.knasoftware.com}
        NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
      labels:
        org.opencontainers.image.source: ${IMAGE_SOURCE_URL:-https://github.com/khiemnd777/manleai}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      LANDING_API_BASE_URL: ${LANDING_API_BASE_URL:-http://api:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
      MARKETING_BASE_URL: ${MARKETING_BASE_URL:-https://ai.knasoftware.com}
      NEXT_PUBLIC_MARKETING_BASE_URL: ${NEXT_PUBLIC_MARKETING_BASE_URL:-https://ai.knasoftware.com}
      SALON_PUBLIC_BASE_URL: ${SALON_PUBLIC_BASE_URL:-https://salon.knasoftware.com}
      NEXT_PUBLIC_LANDING_BASE_URL: ${NEXT_PUBLIC_LANDING_BASE_URL:-https://salon.knasoftware.com}
    expose:
      - "3000"
    ports:
      - "${LANDING_BIND_HOST:-127.0.0.1}:${LANDING_PORT:-13090}:3000"
    networks:
      - app

  pos-calendar:
    image: ${IMAGE_REPOSITORY:-manleai}/manleai-pos-calendar:${IMAGE_TAG:-local}
    build:
      context: ./pos-calendar
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
      labels:
        org.opencontainers.image.source: ${IMAGE_SOURCE_URL:-https://github.com/khiemnd777/manleai}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://platform.knasoftware.com}
    expose:
      - "3000"
    ports:
      - "${POS_CALENDAR_BIND_HOST:-127.0.0.1}:${POS_CALENDAR_PORT:-13091}:3000"
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
