services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_receptionist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_receptionist}
      POSTGRES_DB: ${POSTGRES_DB:-ai_receptionist}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://ai_receptionist:ai_receptionist@postgres:5432/ai_receptionist?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-720}
      TOKEN_ENCRYPTION_KEY_BASE64: ${TOKEN_ENCRYPTION_KEY_BASE64:?TOKEN_ENCRYPTION_KEY_BASE64 is required}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3088}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_CLIENT_ID: ${SQUARE_CLIENT_ID:-}
      SQUARE_CLIENT_SECRET: ${SQUARE_CLIENT_SECRET:-}
      SQUARE_REDIRECT_URL: ${SQUARE_REDIRECT_URL:-http://localhost:18089/api/integrations/square/callback}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-twilio}
      VOICE_PUBLIC_BASE_URL: ${VOICE_PUBLIC_BASE_URL:-http://localhost:18089}
      VOICE_TWILIO_AUTH_TOKEN: ${VOICE_TWILIO_AUTH_TOKEN:-}
      VOICE_TWILIO_INCOMING_PATH: ${VOICE_TWILIO_INCOMING_PATH:-/api/voice/twilio/incoming}
      VOICE_TWILIO_TURN_PATH: ${VOICE_TWILIO_TURN_PATH:-/api/voice/twilio/turn}
      VOICE_TWILIO_RECORDING_PATH: ${VOICE_TWILIO_RECORDING_PATH:-/api/voice/twilio/recording}
      VOICE_AI_PROVIDER: ${VOICE_AI_PROVIDER:-}
      VOICE_OPENAI_API_KEY: ${VOICE_OPENAI_API_KEY:-}
      VOICE_OPENAI_BASE_URL: ${VOICE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VOICE_OPENAI_TRANSCRIPTION_MODEL: ${VOICE_OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      VOICE_OPENAI_REPLY_MODEL: ${VOICE_OPENAI_REPLY_MODEL:-gpt-4.1-mini}
      VOICE_OPENAI_SPEECH_MODEL: ${VOICE_OPENAI_SPEECH_MODEL:-gpt-4o-mini-tts}
      VOICE_OPENAI_SPEECH_VOICE: ${VOICE_OPENAI_SPEECH_VOICE:-alloy}
    ports:
      - "${API_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18089}
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18089}
    ports:
      - "${FRONTEND_PORT:-3088}:3000"

volumes:
  postgres_data:
