name: Production Platform Admin credential recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE_PRODUCTION_PLATFORM_ADMIN_CREDENTIAL exactly
        required: true
        type: string
      approval_reference:
        description: Non-sensitive approved change reference
        required: true
        type: string
      expected_release_tag:
        description: Exact release tag currently running in production
        required: true
        type: string
      recovery_public_key_b64:
        description: Base64-encoded RSA public key PEM for encrypted credential handoff
        required: true
        type: string

concurrency:
  group: manleai-production-platform-admin-credential-recovery
  cancel-in-progress: false

permissions:
  contents: read

env:
  RECOVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  RECOVERY_ACTION_KEY: production-platform-admin-recovery-${{ github.run_id }}

jobs:
  rotate-platform-admin-credential:
    name: Rotate the single active Platform Admin credential
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate approval and protected inputs
        env:
          ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_RECOVERY_PASSWORD }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          RECOVERY_PUBLIC_KEY_B64: ${{ inputs.recovery_public_key_b64 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_PASSWORD"
          if [ "$CONFIRMATION" != "ROTATE_PRODUCTION_PLATFORM_ADMIN_CREDENTIAL" ]; then
            echo "::error::The production Platform Admin recovery confirmation does not match."
            exit 1
          fi
          if [[ ! "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]] || \
             [[ ! "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || \
             [ "${#ADMIN_PASSWORD}" -lt 20 ] || [[ "$ADMIN_PASSWORD" == *$'\n'* ]]; then
            echo "::error::The production Platform Admin recovery metadata or secret is invalid."
            exit 1
          fi
          for key in RECOVERY_PUBLIC_KEY_B64 REMOTE_USER SERVER_IP SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing protected production recovery input: ${key}"
              exit 1
            fi
          done
          private_dir="$RUNNER_TEMP/platform-admin-recovery"
          install -d -m 700 "$private_dir"
          printf '%s' "$RECOVERY_PUBLIC_KEY_B64" | base64 --decode > "$private_dir/recovery-public.pem"
          chmod 600 "$private_dir/recovery-public.pem"
          openssl pkey -pubin -in "$private_dir/recovery-public.pem" -noout
          bash -n deploy/production-platform-admin-credential-recovery.sh
          bash deploy/production-platform-admin-credential-recovery-test.sh

      - name: Test and build protected access operator
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./cmd/platform-access ./modules/access
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/platform-access" ./cmd/platform-access
          chmod 700 "$RUNNER_TEMP/platform-access"

      - name: Prepare private recovery secret
        env:
          ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/platform-admin-recovery"
          printf '%s' "$ADMIN_PASSWORD" > "$private_dir/platform-admin-password"
          chmod 600 "$private_dir/platform-admin-password"

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Upload private recovery bundle
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/manleai-platform-admin-recovery-$RECOVERY_ID"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$REMOTE_USER@$SERVER_IP" "install -d -m 700 '$remote_dir'"
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$RUNNER_TEMP/platform-access" \
            deploy/production-platform-admin-credential-recovery.sh \
            deploy/production-account-audit.sh \
            "$RUNNER_TEMP/platform-admin-recovery/platform-admin-password" \
            "$REMOTE_USER@$SERVER_IP:$remote_dir/"

      - name: Apply production credential recovery
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/manleai-platform-admin-recovery-$RECOVERY_ID"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            "$REMOTE_USER@$SERVER_IP" \
            "RECOVERY_ID='$RECOVERY_ID' EXPECTED_RELEASE_TAG='$EXPECTED_RELEASE_TAG' APPROVAL_REFERENCE='$APPROVAL_REFERENCE' RECOVERY_ACTION_KEY='$RECOVERY_ACTION_KEY' bash '$remote_dir/production-platform-admin-credential-recovery.sh'"

      - name: Download and encrypt credential handoff
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/platform-admin-recovery"
          remote_dir="/tmp/manleai-platform-admin-recovery-$RECOVERY_ID"
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$REMOTE_USER@$SERVER_IP:$remote_dir/output/platform-admin-recovery-result.json" \
            "$private_dir/result.json"
          chmod 600 "$private_dir/result.json"
          admin_email="$(jq -er '.email | select(type == "string" and length > 0)' "$private_dir/result.json")"
          echo "::add-mask::$admin_email"
          jq -e '
            .user_id | type == "string" and length > 0
          ' "$private_dir/result.json" >/dev/null
          jq -e '
            .assignment_id | type == "string" and length > 0
          ' "$private_dir/result.json" >/dev/null
          jq -e '
            .assignment_version | type == "number" and . > 0
          ' "$private_dir/result.json" >/dev/null
          node deploy/encrypt-platform-admin-credential-handoff.mjs \
            "$private_dir/result.json" \
            "$private_dir/recovery-public.pem" \
            "$private_dir/credential-handoff.encrypted.json"
          rm -f "$private_dir/result.json"
          printf 'credential_handoff=encrypted\n'

      - name: Upload encrypted credential handoff
        uses: actions/upload-artifact@v4
        with:
          name: platform-admin-credential-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-admin-recovery/credential-handoff.encrypted.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove remote recovery bundle
        if: ${{ always() }}
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set +e
          remote_dir="/tmp/manleai-platform-admin-recovery-$RECOVERY_ID"
          if [ -s "$HOME/.ssh/id_ed25519" ] && [ -n "${REMOTE_USER:-}" ] && [ -n "${SERVER_IP:-}" ]; then
            ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$REMOTE_USER@$SERVER_IP" \
              "rm -f '$remote_dir/platform-access' '$remote_dir/production-platform-admin-credential-recovery.sh' '$remote_dir/production-account-audit.sh' '$remote_dir/platform-admin-password' '$remote_dir/output/platform-admin-recovery-result.json'; rmdir '$remote_dir/output' 2>/dev/null || true; rmdir '$remote_dir' 2>/dev/null || true"
          fi

      - name: Remove local recovery plaintext and SSH key
        if: ${{ always() }}
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/platform-access"
          rm -f "$RUNNER_TEMP/platform-admin-recovery/platform-admin-password" \
            "$RUNNER_TEMP/platform-admin-recovery/result.json" \
            "$RUNNER_TEMP/platform-admin-recovery/recovery-public.pem" \
            "$RUNNER_TEMP/platform-admin-recovery/credential-handoff.encrypted.json"
          rmdir "$RUNNER_TEMP/platform-admin-recovery" 2>/dev/null || true
