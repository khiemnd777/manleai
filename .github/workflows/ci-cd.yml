name: CI/CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: manleai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/manleai
  EDGE_CADDY_CONTAINER: edge-gateway-caddy
  EDGE_PATH: /opt/edge-gateway
  RELEASE_ID: ${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_NAME: manleai-release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}.tgz
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.ref_name }}
  IMAGE_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

  web:
    name: Web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - landing
          - pos-calendar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          LANDING_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_LANDING_BASE_URL: http://localhost:3090

  build-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build configuration
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ENV_B64:-}" ]; then
            echo "::error::Missing GitHub secret: PROJECT_ENV_B64"
            exit 1
          fi
          printf '%s' "$PROJECT_ENV_B64" | base64 -d >/dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release images
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
        run: |
          set -euo pipefail
          project_env="$RUNNER_TEMP/project.env"
          trap 'rm -f "$project_env"' EXIT
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$project_env"
          chmod 600 "$project_env"

          docker compose --env-file "$project_env" -f docker-compose.prod.yml build api frontend landing pos-calendar
          docker compose --env-file "$project_env" -f docker-compose.prod.yml push api frontend landing pos-calendar

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
      - build-images
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          for key in PROJECT_ENV_B64 REMOTE_USER SERVER_IP SSH_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: ${key}"
              exit 1
            fi
          done
          printf '%s' "$PROJECT_ENV_B64" | base64 -d >/dev/null

      - name: Install SSH tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create deployment bundle
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$RELEASE_NAME" docker-compose.prod.yml deploy
          echo "RELEASE_ARCHIVE=$RUNNER_TEMP/$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Preflight VPS
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          EDGE_CADDY_CONTAINER: ${{ env.EDGE_CADDY_CONTAINER }}
          EDGE_PATH: ${{ env.EDGE_PATH }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' EDGE_CADDY_CONTAINER='$EDGE_CADDY_CONTAINER' EDGE_PATH='$EDGE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker is not installed on the VPS."
            exit 1
          fi

          docker compose version >/dev/null

          if [ ! -f "$EDGE_PATH/docker-compose.yml" ]; then
            echo "::error::Edge gateway compose file is missing at $EDGE_PATH/docker-compose.yml."
            exit 1
          fi

          if [ ! -d "$EDGE_PATH/conf.d" ]; then
            echo "::error::Edge gateway conf.d directory is missing at $EDGE_PATH/conf.d."
            exit 1
          fi

          if docker ps --format '{{.Names}}' | grep -qx 'perfect-pitch-caddy-1'; then
            echo "::error::Legacy perfect-pitch Caddy container is still running and may own ports 80/443."
            exit 1
          fi

          if ! docker ps --format '{{.Names}}' | grep -qx "$EDGE_CADDY_CONTAINER"; then
            echo "::error::Edge gateway Caddy container $EDGE_CADDY_CONTAINER is not running."
            exit 1
          fi

          docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile >/dev/null
          mkdir -p "$DEPLOY_PATH/releases"
          REMOTE

      - name: Upload deployment bundle and env
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          env_file="$RUNNER_TEMP/project.env"
          images_file="$RUNNER_TEMP/manleai-images.env"
          trap 'rm -f "$env_file" "$images_file"' EXIT
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$env_file"
          chmod 600 "$env_file"
          {
            printf 'IMAGE_REPOSITORY=%s\n' "$IMAGE_REPOSITORY"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } > "$images_file"
          chmod 600 "$images_file"

          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$RELEASE_ARCHIVE" "$REMOTE_USER@$SERVER_IP:/tmp/$RELEASE_NAME"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$env_file" "$REMOTE_USER@$SERVER_IP:/tmp/manleai-project.env"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$images_file" "$REMOTE_USER@$SERVER_IP:/tmp/manleai-images.env"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          mv /tmp/manleai-project.env "$DEPLOY_PATH/project.env.tmp"
          chmod 600 "$DEPLOY_PATH/project.env.tmp"
          mv "$DEPLOY_PATH/project.env.tmp" "$DEPLOY_PATH/project.env"
          mv /tmp/manleai-images.env "$DEPLOY_PATH/images.env.tmp"
          chmod 600 "$DEPLOY_PATH/images.env.tmp"
          REMOTE

      - name: Deploy release
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          EDGE_CADDY_CONTAINER: ${{ env.EDGE_CADDY_CONTAINER }}
          EDGE_PATH: ${{ env.EDGE_PATH }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"

          collect_deploy_diagnostics() {
            status=$?
            trap - ERR
            set +e
            echo "::group::VPS deploy diagnostics"
            sshpass -e ssh \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=2 \
              "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
            set +e
            release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"

            echo "== Memory =="
            free -h || true
            echo "== Disk =="
            df -h "$DEPLOY_PATH" || true
            echo "== Docker disk usage =="
            docker system df || true

            if [ -f "$release_dir/docker-compose.prod.yml" ]; then
              cd "$release_dir"
              echo "== Compose status =="
              docker compose --env-file "$DEPLOY_PATH/project.env" -f docker-compose.prod.yml -p manleai ps || true
              echo "== Application logs =="
              docker compose --env-file "$DEPLOY_PATH/project.env" -f docker-compose.prod.yml -p manleai logs --tail=120 api frontend landing pos-calendar || true
            fi
          REMOTE
            echo "::endgroup::"
            exit "$status"
          }

          trap collect_deploy_diagnostics ERR
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' EDGE_CADDY_CONTAINER='$EDGE_CADDY_CONTAINER' EDGE_PATH='$EDGE_PATH' RELEASE_ID='$RELEASE_ID' RELEASE_NAME='$RELEASE_NAME' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail

          release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"
          archive="/tmp/$RELEASE_NAME"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          if [ ! -f "$DEPLOY_PATH/images.env.tmp" ]; then
            echo "::error::Release image metadata is missing."
            exit 1
          fi
          mv "$DEPLOY_PATH/images.env.tmp" "$release_dir/images.env"
          chmod 600 "$release_dir/images.env"

          compose() {
            docker compose \
              --env-file "$DEPLOY_PATH/project.env" \
              --env-file "$release_dir/images.env" \
              -f "$release_dir/docker-compose.prod.yml" \
              -p manleai "$@"
          }

          rollback_images="$release_dir/rollback-images.env"
          rollback_release() {
            if [ ! -f "$rollback_images" ]; then
              return
            fi
            echo "Restoring the application images that were running before this release."
            docker compose \
              --env-file "$DEPLOY_PATH/project.env" \
              --env-file "$rollback_images" \
              -f "$release_dir/docker-compose.prod.yml" \
              -p manleai up -d --no-build --remove-orphans || true
          }

          capture_rollback_images() {
            : > "$rollback_images"
            printf 'IMAGE_REPOSITORY=manleai-rollback\nIMAGE_TAG=%s\n' "$RELEASE_ID" >> "$rollback_images"
            for service in api frontend landing pos-calendar; do
              container_id="$(compose ps -q "$service" || true)"
              if [ -z "$container_id" ]; then
                rm -f "$rollback_images"
                return
              fi
              image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
              if ! docker image inspect "$image_id" >/dev/null 2>&1; then
                echo "::warning::The current $service container has no locally retained image; automatic rollback is unavailable for this one-time GHCR migration."
                rm -f "$rollback_images"
                return
              fi
              docker image tag "$image_id" "manleai-rollback/manleai-$service:$RELEASE_ID"
            done
          }

          pull_release_images() {
            set -a
            . "$release_dir/images.env"
            set +a
            for service in api frontend landing pos-calendar; do
              image="$IMAGE_REPOSITORY/manleai-$service:$IMAGE_TAG"
              echo "Pulling $image"
              docker pull "$image"
            done
          }

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          echo "Removing unused Docker build cache from legacy VPS builds."
          docker builder prune --all --force
          pull_release_images
          capture_rollback_images
          compose up -d --no-build --remove-orphans
          compose ps

          set -a
          . "$DEPLOY_PATH/project.env"
          set +a

          ADMIN_DOMAIN="${ADMIN_DOMAIN:-ai.knasoftware.com}"
          LANDING_DOMAIN="${LANDING_DOMAIN:-salon.knasoftware.com}"
          POS_DOMAIN="${POS_DOMAIN:-pos.knasoftware.com}"
          API_PORT="${API_PORT:-18089}"
          FRONTEND_PORT="${FRONTEND_PORT:-13088}"
          LANDING_PORT="${LANDING_PORT:-13090}"
          POS_CALENDAR_PORT="${POS_CALENDAR_PORT:-13091}"

          for attempt in $(seq 1 30); do
            if command -v curl >/dev/null 2>&1; then
              healthcheck_cmd=(curl -fsS "http://127.0.0.1:${API_PORT}/healthz")
            else
              healthcheck_cmd=(wget -qO- "http://127.0.0.1:${API_PORT}/healthz")
            fi

            if "${healthcheck_cmd[@]}"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::API healthcheck failed after deploy."
              compose logs --tail=120 api
              rollback_release
              exit 1
            fi
            sleep 2
          done

          tmp_caddy="$(mktemp)"
          sed \
            -e "s#{{ADMIN_DOMAIN}}#${ADMIN_DOMAIN}#g" \
            -e "s#{{LANDING_DOMAIN}}#${LANDING_DOMAIN}#g" \
            -e "s#{{POS_DOMAIN}}#${POS_DOMAIN}#g" \
            -e "s#{{API_PORT}}#${API_PORT}#g" \
            -e "s#{{FRONTEND_PORT}}#${FRONTEND_PORT}#g" \
            -e "s#{{LANDING_PORT}}#${LANDING_PORT}#g" \
            -e "s#{{POS_CALENDAR_PORT}}#${POS_CALENDAR_PORT}#g" \
            "$release_dir/deploy/manleai.caddy.template" > "$tmp_caddy"

          edge_conf="$EDGE_PATH/conf.d/manleai.caddy"
          backup="$EDGE_PATH/conf.d/manleai.caddy.before-$RELEASE_ID"
          if [ -f "$edge_conf" ]; then
            cp "$edge_conf" "$backup"
          fi

          cp "$tmp_caddy" "$edge_conf"
          rm -f "$tmp_caddy"

          if ! docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile; then
            if [ -f "$backup" ]; then
              cp "$backup" "$edge_conf"
            else
              rm -f "$edge_conf"
            fi
            docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile >/dev/null || true
            echo "::error::Rendered ManleAI Caddy route failed validation; restored previous edge config."
            rollback_release
            exit 1
          fi

          if ! docker exec "$EDGE_CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile; then
            if [ -f "$backup" ]; then
              cp "$backup" "$edge_conf"
            else
              rm -f "$edge_conf"
            fi
            docker exec "$EDGE_CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile >/dev/null || true
            rollback_release
            echo "::error::Reloading the ManleAI edge route failed; restored the previous route and application images."
            exit 1
          fi
          ln -sfn "$release_dir" "$DEPLOY_PATH/current"
          rm -f "$archive"
          REMOTE
          trap - ERR
