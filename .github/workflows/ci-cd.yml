name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag label, for example v2026.06.25.1
        required: false
        type: string

concurrency:
  group: manleai-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/manleai
  EDGE_CADDY_CONTAINER: edge-gateway-caddy
  EDGE_PATH: /opt/edge-gateway
  RELEASE_ID: ${{ github.event.inputs.tag || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_NAME: manleai-release-${{ github.event.inputs.tag || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tgz

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

  web:
    name: Web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          LANDING_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_LANDING_BASE_URL: http://localhost:3090

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          for key in PROJECT_ENV_B64 REMOTE_USER SERVER_IP SSH_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: ${key}"
              exit 1
            fi
          done
          printf '%s' "$PROJECT_ENV_B64" | base64 -d >/dev/null

      - name: Install SSH tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create release archive
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='project.env' \
            --exclude='deploy/project.env' \
            --exclude='backend/.gocache' \
            --exclude='backend/tmp' \
            --exclude='frontend/.next' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/tsconfig.tsbuildinfo' \
            --exclude='landing/.next' \
            --exclude='landing/node_modules' \
            --exclude='landing/tsconfig.tsbuildinfo' \
            -czf "$RUNNER_TEMP/$RELEASE_NAME" .
          echo "RELEASE_ARCHIVE=$RUNNER_TEMP/$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Preflight VPS
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          EDGE_CADDY_CONTAINER: ${{ env.EDGE_CADDY_CONTAINER }}
          EDGE_PATH: ${{ env.EDGE_PATH }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' EDGE_CADDY_CONTAINER='$EDGE_CADDY_CONTAINER' EDGE_PATH='$EDGE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker is not installed on the VPS."
            exit 1
          fi

          docker compose version >/dev/null

          if [ ! -f "$EDGE_PATH/docker-compose.yml" ]; then
            echo "::error::Edge gateway compose file is missing at $EDGE_PATH/docker-compose.yml."
            exit 1
          fi

          if [ ! -d "$EDGE_PATH/conf.d" ]; then
            echo "::error::Edge gateway conf.d directory is missing at $EDGE_PATH/conf.d."
            exit 1
          fi

          if docker ps --format '{{.Names}}' | grep -qx 'perfect-pitch-caddy-1'; then
            echo "::error::Legacy perfect-pitch Caddy container is still running and may own ports 80/443."
            exit 1
          fi

          if ! docker ps --format '{{.Names}}' | grep -qx "$EDGE_CADDY_CONTAINER"; then
            echo "::error::Edge gateway Caddy container $EDGE_CADDY_CONTAINER is not running."
            exit 1
          fi

          docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile >/dev/null
          mkdir -p "$DEPLOY_PATH/releases"
          REMOTE

      - name: Upload release and env
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          env_file="$RUNNER_TEMP/project.env"
          trap 'rm -f "$env_file"' EXIT
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$env_file"
          chmod 600 "$env_file"

          sshpass -e scp -o StrictHostKeyChecking=accept-new "$RELEASE_ARCHIVE" "$REMOTE_USER@$SERVER_IP:/tmp/$RELEASE_NAME"
          sshpass -e scp -o StrictHostKeyChecking=accept-new "$env_file" "$REMOTE_USER@$SERVER_IP:/tmp/manleai-project.env"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          mv /tmp/manleai-project.env "$DEPLOY_PATH/project.env.tmp"
          chmod 600 "$DEPLOY_PATH/project.env.tmp"
          mv "$DEPLOY_PATH/project.env.tmp" "$DEPLOY_PATH/project.env"
          REMOTE

      - name: Deploy release
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          EDGE_CADDY_CONTAINER: ${{ env.EDGE_CADDY_CONTAINER }}
          EDGE_PATH: ${{ env.EDGE_PATH }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' EDGE_CADDY_CONTAINER='$EDGE_CADDY_CONTAINER' EDGE_PATH='$EDGE_PATH' RELEASE_ID='$RELEASE_ID' RELEASE_NAME='$RELEASE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"
          archive="/tmp/$RELEASE_NAME"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          ln -sfn "$release_dir" "$DEPLOY_PATH/current"

          cd "$DEPLOY_PATH/current"
          docker compose --env-file "$DEPLOY_PATH/project.env" -f docker-compose.prod.yml -p manleai up -d --build --remove-orphans
          docker compose --env-file "$DEPLOY_PATH/project.env" -f docker-compose.prod.yml -p manleai ps

          set -a
          . "$DEPLOY_PATH/project.env"
          set +a

          ADMIN_DOMAIN="${ADMIN_DOMAIN:-ai.knasoftware.com}"
          LANDING_DOMAIN="${LANDING_DOMAIN:-salon.knasoftware.com}"
          API_PORT="${API_PORT:-18089}"
          FRONTEND_PORT="${FRONTEND_PORT:-13088}"
          LANDING_PORT="${LANDING_PORT:-13090}"

          for attempt in $(seq 1 30); do
            if command -v curl >/dev/null 2>&1; then
              healthcheck_cmd=(curl -fsS "http://127.0.0.1:${API_PORT}/healthz")
            else
              healthcheck_cmd=(wget -qO- "http://127.0.0.1:${API_PORT}/healthz")
            fi

            if "${healthcheck_cmd[@]}"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::API healthcheck failed after deploy."
              docker compose --env-file "$DEPLOY_PATH/project.env" -f docker-compose.prod.yml -p manleai logs --tail=120 api
              exit 1
            fi
            sleep 2
          done

          tmp_caddy="$(mktemp)"
          sed \
            -e "s#{{ADMIN_DOMAIN}}#${ADMIN_DOMAIN}#g" \
            -e "s#{{LANDING_DOMAIN}}#${LANDING_DOMAIN}#g" \
            -e "s#{{API_PORT}}#${API_PORT}#g" \
            -e "s#{{FRONTEND_PORT}}#${FRONTEND_PORT}#g" \
            -e "s#{{LANDING_PORT}}#${LANDING_PORT}#g" \
            "$release_dir/deploy/manleai.caddy.template" > "$tmp_caddy"

          edge_conf="$EDGE_PATH/conf.d/manleai.caddy"
          backup="$EDGE_PATH/conf.d/manleai.caddy.before-$RELEASE_ID"
          if [ -f "$edge_conf" ]; then
            cp "$edge_conf" "$backup"
          fi

          cp "$tmp_caddy" "$edge_conf"
          rm -f "$tmp_caddy"

          if ! docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile; then
            if [ -f "$backup" ]; then
              cp "$backup" "$edge_conf"
            else
              rm -f "$edge_conf"
            fi
            docker exec "$EDGE_CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile >/dev/null || true
            echo "::error::Rendered ManleAI Caddy route failed validation; restored previous edge config."
            exit 1
          fi

          docker exec "$EDGE_CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile
          rm -f "$archive"
          REMOTE
