name: CI/CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: manleai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/manleai
  RELEASE_ID: ${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_NAME: manleai-release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}.tgz
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.ref_name }}
  IMAGE_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate release-gate manifest and fail-closed guards
        run: bash ../deploy/owner-first-release-gate.sh self-test

      - name: Backend release contract
        run: bash ../deploy/owner-first-release-gate.sh backend

  web:
    name: Web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - landing
          - pos-calendar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Authority evidence contract tests
        if: ${{ matrix.app != 'landing' }}
        working-directory: ${{ matrix.app }}
        run: npm run test:evidence

      - name: Landing security contract tests
        if: ${{ matrix.app == 'landing' }}
        working-directory: ${{ matrix.app }}
        run: npm run test:security

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          LANDING_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_API_BASE_URL: http://localhost:18089
          NEXT_PUBLIC_LANDING_BASE_URL: http://localhost:3090
          NEXT_PUBLIC_MARKETING_BASE_URL: http://localhost:3090
          MARKETING_BASE_URL: http://localhost:3090
          SALON_PUBLIC_BASE_URL: http://localhost:3090

  release-gate:
    name: Owner-first release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: owner_first_release_gate
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: owner_first_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner_first_release_gate -d owner_first_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOMAXPROCS: 2
      PGDATABASE: owner_first_release_gate
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: owner_first_release_gate
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate release-gate manifest and fail-closed guards
        run: bash deploy/owner-first-release-gate.sh self-test

      - name: Fresh PostgreSQL migrations and serial integration contract
        run: bash deploy/owner-first-release-gate.sh postgres

      - name: Tenant and security contract
        run: bash deploy/owner-first-release-gate.sh security

  build-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs:
      - backend
      - release-gate
      - web
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build configuration
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ENV_B64:-}" ]; then
            echo "::error::Missing GitHub secret: PROJECT_ENV_B64"
            exit 1
          fi
          project_env="$RUNNER_TEMP/project.env"
          trap 'rm -f "$project_env"' EXIT
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$project_env"
          chmod 600 "$project_env"
          bash deploy/validate-production-domain-contract.sh "$project_env"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release images
        env:
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
        run: |
          set -euo pipefail
          project_env="$RUNNER_TEMP/project.env"
          trap 'rm -f "$project_env"' EXIT
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$project_env"
          chmod 600 "$project_env"

          docker compose --env-file "$project_env" -f docker-compose.prod.yml build api worker frontend landing pos-calendar
          docker compose --env-file "$project_env" -f docker-compose.prod.yml push api worker frontend landing pos-calendar

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    environment: production
    needs:
      - backend
      - release-gate
      - web
      - build-images
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_DATA_PROFILE: ${{ vars.DEPLOY_DATA_PROFILE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          POSTGRES_BACKUP_STORAGE_APPROVAL: ${{ vars.POSTGRES_BACKUP_STORAGE_APPROVAL }}
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          SAMPLE_DATA_ENV_B64: ${{ secrets.SAMPLE_DATA_ENV_B64 }}
          SAMPLE_TEST_RESET_RELEASE_TAG: ${{ vars.SAMPLE_TEST_RESET_RELEASE_TAG }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          project_env="$RUNNER_TEMP/project.env"
          sample_env="$RUNNER_TEMP/sample-data.env"
          trap 'rm -f "$project_env" "$sample_env"' EXIT
          for key in PROJECT_ENV_B64 REMOTE_USER SERVER_IP SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: ${key}"
              exit 1
            fi
          done
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$project_env"
          chmod 600 "$project_env"
          bash deploy/validate-production-domain-contract.sh "$project_env"
          case "$DEPLOY_DATA_PROFILE" in
            live) ;;
            sample_test)
              if [ -z "${SAMPLE_DATA_ENV_B64:-}" ]; then
                echo "::error::SAMPLE_DATA_ENV_B64 is required for the sample_test deployment profile."
                exit 1
              fi
              printf '%s' "$SAMPLE_DATA_ENV_B64" | base64 -d > "$sample_env"
              chmod 600 "$sample_env"
              set -a
              . "$sample_env"
              set +a
              for key in \
                SAMPLE_PLATFORM_ADMIN_EMAIL SAMPLE_PLATFORM_ADMIN_NAME SAMPLE_PLATFORM_ADMIN_PASSWORD \
                SAMPLE_PLATFORM_OPS_EMAIL SAMPLE_PLATFORM_OPS_NAME SAMPLE_PLATFORM_OPS_PASSWORD \
                SAMPLE_TENANT_OWNER_PASSWORD; do
                if [ -z "${!key:-}" ]; then
                  echo "::error::${key} is missing from SAMPLE_DATA_ENV_B64."
                  exit 1
                fi
              done
              if [ "${#SAMPLE_PLATFORM_ADMIN_PASSWORD}" -lt 12 ] || \
                 [ "${#SAMPLE_PLATFORM_OPS_PASSWORD}" -lt 12 ] || \
                 [ "${#SAMPLE_TENANT_OWNER_PASSWORD}" -lt 12 ]; then
                echo "::error::Every sample password must contain at least 12 characters."
                exit 1
              fi
              ;;
            *)
              echo "::error::DEPLOY_DATA_PROFILE must be exactly live or sample_test."
              exit 1
              ;;
          esac
          if [ -n "${SAMPLE_TEST_RESET_RELEASE_TAG:-}" ] && [[ ! "$SAMPLE_TEST_RESET_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$ ]]; then
            echo "::error::SAMPLE_TEST_RESET_RELEASE_TAG has an unsafe shape."
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$ ]]; then
            echo "::error::Release tags must use only bounded artifact-safe characters."
            exit 1
          fi
          if [ "$POSTGRES_BACKUP_STORAGE_APPROVAL" != "encrypted-private:/opt/manleai/backups" ]; then
            echo "::error::POSTGRES_BACKUP_STORAGE_APPROVAL must approve the exact encrypted private backup path."
            exit 1
          fi

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Create deployment bundle
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$RELEASE_NAME" docker-compose.prod.yml deploy backend/migrations
          echo "RELEASE_ARCHIVE=$RUNNER_TEMP/$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Preflight VPS
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker is not installed on the VPS."
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "::error::The deploy identity cannot access Docker."
            exit 1
          fi

          docker compose version >/dev/null
          command -v project-edgectl >/dev/null
          systemctl is-active --quiet caddy
          sudo -n project-edgectl list >/dev/null
          mkdir -p "$DEPLOY_PATH/releases"
          REMOTE

      - name: Upload deployment bundle and env
        env:
          DEPLOY_DATA_PROFILE: ${{ vars.DEPLOY_DATA_PROFILE }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          SAMPLE_DATA_ENV_B64: ${{ secrets.SAMPLE_DATA_ENV_B64 }}
          GHCR_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/project.env"
          images_file="$RUNNER_TEMP/manleai-images.env"
          project_env_remote="/tmp/manleai-project-$RELEASE_ID.env"
          images_env_remote="/tmp/manleai-images-$RELEASE_ID.env"
          ghcr_token_file="$RUNNER_TEMP/manleai-ghcr-token"
          ghcr_token_remote="/tmp/manleai-ghcr-token-$RELEASE_ID"
          sample_env_file="$RUNNER_TEMP/manleai-sample-data.env"
          sample_env_remote="/tmp/manleai-sample-data-$RELEASE_ID.env"
          remote_credentials_uploaded=false
          cleanup_remote_credentials() {
            if [ "$remote_credentials_uploaded" = true ]; then
              ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$REMOTE_USER@$SERVER_IP" "rm -f '$project_env_remote' '$images_env_remote' '$ghcr_token_remote' '$sample_env_remote'" || true
            fi
          }
          trap 'rm -f "$env_file" "$images_file" "$ghcr_token_file" "$sample_env_file"' EXIT
          trap cleanup_remote_credentials ERR
          printf '%s' "$PROJECT_ENV_B64" | base64 -d > "$env_file"
          chmod 600 "$env_file"
          {
            printf 'IMAGE_REPOSITORY=%s\n' "$IMAGE_REPOSITORY"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } > "$images_file"
          chmod 600 "$images_file"
          printf '%s' "$GHCR_TOKEN" > "$ghcr_token_file"
          chmod 600 "$ghcr_token_file"
          if [ "$DEPLOY_DATA_PROFILE" = "sample_test" ]; then
            printf '%s' "$SAMPLE_DATA_ENV_B64" | base64 -d > "$sample_env_file"
            chmod 600 "$sample_env_file"
          fi

          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$RELEASE_ARCHIVE" "$REMOTE_USER@$SERVER_IP:/tmp/$RELEASE_NAME"
          remote_credentials_uploaded=true
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$env_file" "$REMOTE_USER@$SERVER_IP:$project_env_remote"
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$images_file" "$REMOTE_USER@$SERVER_IP:$images_env_remote"
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$ghcr_token_file" "$REMOTE_USER@$SERVER_IP:$ghcr_token_remote"
          if [ "$DEPLOY_DATA_PROFILE" = "sample_test" ]; then
            scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$sample_env_file" "$REMOTE_USER@$SERVER_IP:$sample_env_remote"
          fi

          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_DATA_PROFILE='$DEPLOY_DATA_PROFILE' PROJECT_ENV_FILE='$project_env_remote' IMAGES_ENV_FILE='$images_env_remote' GHCR_TOKEN_FILE='$ghcr_token_remote' SAMPLE_DATA_ENV_FILE='$sample_env_remote' bash -s" <<'REMOTE'
          set -euo pipefail
          test -s "$PROJECT_ENV_FILE"
          test -s "$IMAGES_ENV_FILE"
          test -s "$GHCR_TOKEN_FILE"
          chmod 600 "$PROJECT_ENV_FILE" "$IMAGES_ENV_FILE" "$GHCR_TOKEN_FILE"
          if [ "$DEPLOY_DATA_PROFILE" = "sample_test" ]; then
            test -s "$SAMPLE_DATA_ENV_FILE"
            chmod 600 "$SAMPLE_DATA_ENV_FILE"
          else
            rm -f "$SAMPLE_DATA_ENV_FILE"
          fi
          REMOTE
          trap - ERR

      - name: Deploy release
        env:
          DEPLOY_DATA_PROFILE: ${{ vars.DEPLOY_DATA_PROFILE }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          GHCR_USERNAME: ${{ github.actor }}
          POSTGRES_BACKUP_STORAGE_APPROVAL: ${{ vars.POSTGRES_BACKUP_STORAGE_APPROVAL }}
          RELEASE_ACTOR: ${{ github.actor }}
          SAMPLE_TEST_RESET_RELEASE_TAG: ${{ vars.SAMPLE_TEST_RESET_RELEASE_TAG }}
        run: |
          set -euo pipefail
          project_env_remote="/tmp/manleai-project-$RELEASE_ID.env"
          images_env_remote="/tmp/manleai-images-$RELEASE_ID.env"
          ghcr_token_remote="/tmp/manleai-ghcr-token-$RELEASE_ID"
          sample_env_remote="/tmp/manleai-sample-data-$RELEASE_ID.env"

          collect_deploy_diagnostics() {
            status=$?
            trap - ERR
            set +e
            echo "::group::VPS deploy diagnostics"
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=2 \
              "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='$RELEASE_ID' PROJECT_ENV_FILE='$project_env_remote' IMAGES_ENV_FILE='$images_env_remote' GHCR_TOKEN_FILE='$ghcr_token_remote' SAMPLE_DATA_ENV_FILE='$sample_env_remote' bash -s" <<'REMOTE'
            set +e
            release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"
            diagnostic_env="$release_dir/project.env"
            if [ ! -f "$diagnostic_env" ]; then
              diagnostic_env="$DEPLOY_PATH/project.env"
            fi

            echo "== Memory =="
            free -h || true
            echo "== Disk =="
            df -h "$DEPLOY_PATH" || true
            echo "== Docker disk usage =="
            docker system df || true

            if [ -f "$release_dir/docker-compose.prod.yml" ] && [ -f "$diagnostic_env" ]; then
              cd "$release_dir"
              echo "== Compose status =="
              docker compose --env-file "$diagnostic_env" -f docker-compose.prod.yml -p manleai ps || true
              echo "== Application logs =="
              docker compose --env-file "$diagnostic_env" -f docker-compose.prod.yml -p manleai logs --tail=120 api worker frontend landing pos-calendar || true
            fi
            rm -f "$PROJECT_ENV_FILE" "$IMAGES_ENV_FILE" "$GHCR_TOKEN_FILE" "$SAMPLE_DATA_ENV_FILE" || true
          REMOTE
            echo "::endgroup::"
            exit "$status"
          }

          trap collect_deploy_diagnostics ERR
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$REMOTE_USER@$SERVER_IP" "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_DATA_PROFILE='$DEPLOY_DATA_PROFILE' RELEASE_ACTOR='$RELEASE_ACTOR' RELEASE_ID='$RELEASE_ID' RELEASE_NAME='$RELEASE_NAME' RELEASE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' PROJECT_ENV_FILE='$project_env_remote' IMAGES_ENV_FILE='$images_env_remote' GHCR_TOKEN_FILE='$ghcr_token_remote' SAMPLE_DATA_ENV_FILE='$sample_env_remote' SAMPLE_TEST_RESET_RELEASE_TAG='$SAMPLE_TEST_RESET_RELEASE_TAG' POSTGRES_BACKUP_STORAGE_APPROVAL='$POSTGRES_BACKUP_STORAGE_APPROVAL' bash -c 'set -euo pipefail; umask 077; buffered_script=\$(mktemp); cleanup() { rm -f \"\$buffered_script\"; }; trap cleanup EXIT; cat > \"\$buffered_script\"; bash \"\$buffered_script\"'" <<'REMOTE'
          set -euo pipefail

          release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"
          archive="/tmp/$RELEASE_NAME"
          active_env="$DEPLOY_PATH/project.env"
          candidate_env="$release_dir/project.env"
          candidate_images="$release_dir/images.env"
          previous_release_dir=""
          previous_env=""
          previous_compose=""
          tmp_caddy=""
          tmp_manifest=""
          previous_caddy=""
          previous_manifest=""
          promoted_env="$DEPLOY_PATH/project.env.next-$RELEASE_ID"
          promoted_current="$DEPLOY_PATH/current.next-$RELEASE_ID"
          cleanup_release_credentials() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f "$PROJECT_ENV_FILE" "$IMAGES_ENV_FILE" "$GHCR_TOKEN_FILE" "$SAMPLE_DATA_ENV_FILE" \
              "$tmp_caddy" "$tmp_manifest" "$previous_caddy" "$previous_manifest" \
              "$promoted_env" "$promoted_current"
          }
          trap cleanup_release_credentials EXIT
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          if [ ! -s "$PROJECT_ENV_FILE" ] || [ ! -s "$IMAGES_ENV_FILE" ]; then
            echo "::error::Release environment or image metadata is missing."
            exit 1
          fi
          mv "$PROJECT_ENV_FILE" "$candidate_env"
          mv "$IMAGES_ENV_FILE" "$candidate_images"
          chmod 600 "$candidate_env" "$candidate_images"

          if [ -e "$DEPLOY_PATH/current" ]; then
            previous_release_dir="$(readlink -f "$DEPLOY_PATH/current")"
            if [ ! -d "$previous_release_dir" ] || [ ! -f "$previous_release_dir/docker-compose.prod.yml" ] || [ ! -f "$active_env" ]; then
              echo "::error::The active release does not have an exact env and Compose rollback boundary."
              exit 1
            fi
            previous_env="$previous_release_dir/project.env"
            previous_compose="$previous_release_dir/docker-compose.prod.yml"
            install -m 600 "$active_env" "$previous_env"
          fi
          if [ "$POSTGRES_BACKUP_STORAGE_APPROVAL" != "encrypted-private:/opt/manleai/backups" ]; then
            echo "::error::The exact encrypted private backup path was not approved."
            exit 1
          fi
          case "$DEPLOY_DATA_PROFILE" in
            live) ;;
            sample_test)
              if [ ! -s "$SAMPLE_DATA_ENV_FILE" ]; then
                echo "::error::Sample-test credentials are missing from the protected deployment handoff."
                exit 1
              fi
              ;;
            *)
              echo "::error::The deployment data profile is invalid."
              exit 1
              ;;
          esac
          if [ ! -s "$GHCR_TOKEN_FILE" ]; then
            echo "::error::GHCR token file is missing."
            exit 1
          fi

          compose() {
            docker compose \
              --env-file "$candidate_env" \
              --env-file "$candidate_images" \
              -f "$release_dir/docker-compose.prod.yml" \
              -p manleai "$@"
          }

          compatibility_record="$release_dir/database-compatibility.env"
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'rollback_policy=expand_contract\n'
            printf 'released_by=%s\n' "$RELEASE_ACTOR"
            printf 'backup_storage_approval=%s\n' "$POSTGRES_BACKUP_STORAGE_APPROVAL"
            printf 'data_profile=%s\n' "$DEPLOY_DATA_PROFILE"
            printf 'sample_reset_release_tag=%s\n' "${SAMPLE_TEST_RESET_RELEASE_TAG:-none}"
          } > "$compatibility_record"
          chmod 600 "$compatibility_record"

          set -a
          . "$candidate_env"
          set +a
          : "${POSTGRES_DB:?POSTGRES_DB is required for the pre-deploy backup}"
          : "${POSTGRES_USER:?POSTGRES_USER is required for the pre-deploy backup}"

          postgres_container_any="$(compose ps -aq postgres || true)"
          postgres_container_running="$(compose ps -q postgres || true)"
          if [ -n "$postgres_container_any" ] && [ -z "$postgres_container_running" ]; then
            echo "::error::The existing PostgreSQL container is not running; refusing to deploy without a backup."
            exit 1
          fi
          if [ -z "$postgres_container_any" ] && docker volume inspect manleai_postgres_data >/dev/null 2>&1; then
            echo "::error::The PostgreSQL volume exists without a Compose container; refusing to treat this as an empty initial deploy."
            exit 1
          fi

          reset_sample_database=false
          migration_preflight_status=0
          if [ -n "$postgres_container_running" ]; then
            set +e
            migration_preflight_output="$(bash "$release_dir/deploy/postgres-migration-preflight.sh" \
              --env-file "$candidate_env" \
              --compose-file "$release_dir/docker-compose.prod.yml" \
              --project manleai \
              --migrations-dir "$release_dir/backend/migrations" 2>&1)"
            migration_preflight_status=$?
            set -e
            printf '%s\n' "$migration_preflight_output"
            if [ "$migration_preflight_status" -eq 42 ]; then
              if [ "$DEPLOY_DATA_PROFILE" != "sample_test" ]; then
                echo "::error::Migration history is incompatible and the live profile forbids automatic database reset."
                exit 1
              fi
              if [ "$SAMPLE_TEST_RESET_RELEASE_TAG" != "$RELEASE_TAG" ]; then
                echo "::error::Migration history is incompatible. SAMPLE_TEST_RESET_RELEASE_TAG must exactly approve this release before the pre-live database can be reset."
                exit 1
              fi
              reset_sample_database=true
            elif [ "$migration_preflight_status" -ne 0 ]; then
              echo "::error::Migration checksum preflight failed operationally."
              exit "$migration_preflight_status"
            fi

            if [ "$DEPLOY_DATA_PROFILE" = "sample_test" ]; then
              set +e
              sample_target_output="$(bash "$release_dir/deploy/postgres-sample-target-preflight.sh" \
                --env-file "$candidate_env" \
                --compose-file "$release_dir/docker-compose.prod.yml" \
                --project manleai 2>&1)"
              sample_target_status=$?
              set -e
              printf '%s\n' "$sample_target_output"
              if [ "$sample_target_status" -eq 43 ]; then
                if [ "$SAMPLE_TEST_RESET_RELEASE_TAG" != "$RELEASE_TAG" ]; then
                  echo "::error::The existing database is not a compatible sample target. SAMPLE_TEST_RESET_RELEASE_TAG must exactly approve this release before reset."
                  exit 1
                fi
                reset_sample_database=true
              elif [ "$sample_target_status" -ne 0 ]; then
                echo "::error::Sample-target preflight failed operationally."
                exit "$sample_target_status"
              fi
            fi
          fi

          backup_record="$release_dir/predeploy-backup.record"
          if [ -n "$postgres_container_running" ]; then
            backup_result="$(bash "$release_dir/deploy/postgres-backup.sh" \
              --env-file "$candidate_env" \
              --compose-file "$release_dir/docker-compose.prod.yml" \
              --project manleai \
              --source-db "$POSTGRES_DB" \
              --db-user "$POSTGRES_USER" \
              --output-dir "$DEPLOY_PATH/backups" \
              --artifact-id "predeploy-$RELEASE_ID" \
              --storage-class encrypted-private)"
            printf '%s\n' "$backup_result" | tee "$backup_record"
          else
            printf 'backup_status=not_applicable_initial_empty_deploy\n' | tee "$backup_record"
          fi
          chmod 600 "$backup_record"

          rollback_images="$release_dir/rollback-images.env"
          rollback_release() {
            if [ ! -f "$rollback_images" ]; then
              return
            fi
            if [ -z "$previous_env" ] || [ -z "$previous_compose" ] || [ ! -f "$previous_env" ] || [ ! -f "$previous_compose" ]; then
              echo "::error::The exact previous env and Compose files are unavailable for image rollback."
              return 1
            fi
            echo "Restoring the previous application images against the forward-compatible database schema."
            echo "This image rollback does not restore or delete any database."
            docker compose \
              --env-file "$previous_env" \
              --env-file "$rollback_images" \
              -f "$previous_compose" \
              -p manleai up -d --no-build --remove-orphans
          }

          capture_rollback_images() {
            : > "$rollback_images"
            printf 'IMAGE_REPOSITORY=manleai-rollback\nIMAGE_TAG=%s\n' "$RELEASE_ID" >> "$rollback_images"
            for service in api worker frontend landing pos-calendar; do
              container_id="$(compose ps -q "$service" || true)"
              if [ -z "$container_id" ]; then
                rm -f "$rollback_images"
                return
              fi
              image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
              if ! docker image inspect "$image_id" >/dev/null 2>&1; then
                echo "::warning::The current $service container has no locally retained image; automatic rollback is unavailable for this one-time GHCR migration."
                rm -f "$rollback_images"
                return
              fi
              docker image tag "$image_id" "manleai-rollback/manleai-$service:$RELEASE_ID"
            done
          }

          pull_release_images() {
            set -a
            . "$candidate_images"
            set +a
            for service in api worker frontend landing pos-calendar; do
              image="$IMAGE_REPOSITORY/manleai-$service:$IMAGE_TAG"
              echo "Pulling $image"
              docker pull "$image"
            done
          }

          docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin < "$GHCR_TOKEN_FILE"

          pull_release_images
          capture_rollback_images
          if [ "$reset_sample_database" = true ]; then
            compose down --remove-orphans
            postgres_volumes=()
            while IFS= read -r volume_name; do
              [ -n "$volume_name" ] && postgres_volumes+=("$volume_name")
            done < <(docker volume ls --quiet \
              --filter 'label=com.docker.compose.project=manleai' \
              --filter 'label=com.docker.compose.volume=postgres_data')
            if [ "${#postgres_volumes[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one Compose-owned PostgreSQL volume for the approved pre-live reset."
              exit 1
            fi
            docker volume rm "${postgres_volumes[0]}"
            reset_record="$release_dir/prelive-database-reset.record"
            {
              printf 'release_tag=%s\n' "$RELEASE_TAG"
              printf 'data_profile=sample_test\n'
              printf 'backup_record=%s\n' "$backup_record"
              printf 'reset_volume=%s\n' "${postgres_volumes[0]}"
            } > "$reset_record"
            chmod 600 "$reset_record"
          fi
          compose up -d --no-build --remove-orphans
          compose ps

          set -a
          . "$candidate_env"
          set +a

          ADMIN_DOMAIN="${ADMIN_DOMAIN:-platform.knasoftware.com}"
          MARKETING_DOMAIN="${MARKETING_DOMAIN:-ai.knasoftware.com}"
          LANDING_DOMAIN="${LANDING_DOMAIN:-salon.knasoftware.com}"
          POS_DOMAIN="${POS_DOMAIN:-pos.knasoftware.com}"
          API_PORT="${API_PORT:-18089}"
          FRONTEND_PORT="${FRONTEND_PORT:-13088}"
          LANDING_PORT="${LANDING_PORT:-13090}"
          POS_CALENDAR_PORT="${POS_CALENDAR_PORT:-13091}"

          for attempt in $(seq 1 30); do
            if command -v curl >/dev/null 2>&1; then
              healthcheck_cmd=(curl -fsS "http://127.0.0.1:${API_PORT}/healthz")
            else
              healthcheck_cmd=(wget -qO- "http://127.0.0.1:${API_PORT}/healthz")
            fi

            if "${healthcheck_cmd[@]}"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::API healthcheck failed after deploy."
              compose logs --tail=120 api
              rollback_release
              exit 1
            fi
            sleep 2
          done

          if [ "$DEPLOY_DATA_PROFILE" = "sample_test" ]; then
            set -a
            . "$SAMPLE_DATA_ENV_FILE"
            set +a
            if ! compose run --rm --no-deps \
              -e SAMPLE_PLATFORM_ADMIN_PASSWORD \
              -e SAMPLE_PLATFORM_OPS_PASSWORD \
              -e SAMPLE_TENANT_OWNER_PASSWORD \
              api /bin/sample-data apply \
              --profile sample_test \
              --confirm APPLY_SAMPLE_TEST_DATA \
              --admin-email "$SAMPLE_PLATFORM_ADMIN_EMAIL" \
              --admin-name "$SAMPLE_PLATFORM_ADMIN_NAME" \
              --ops-email "$SAMPLE_PLATFORM_OPS_EMAIL" \
              --ops-name "$SAMPLE_PLATFORM_OPS_NAME"; then
              echo "::error::Sample-test provisioning failed."
              rollback_release
              exit 1
            fi
            unset SAMPLE_PLATFORM_ADMIN_PASSWORD SAMPLE_PLATFORM_OPS_PASSWORD SAMPLE_TENANT_OWNER_PASSWORD
          fi

          if ! bash "$release_dir/deploy/postgres-data-profile-guard.sh" \
              --profile "$DEPLOY_DATA_PROFILE" \
              --env-file "$candidate_env" \
              --compose-file "$release_dir/docker-compose.prod.yml" \
              --project manleai; then
            echo "::error::The deployed database does not satisfy the selected data profile."
            rollback_release
            exit 1
          fi

          render_edge_bundle() {
            local env_file="$1"
            local template_dir="$2"
            local caddy_output="$3"
            local manifest_output="$4"
            (
              set -a
              . "$env_file"
              set +a
              ADMIN_DOMAIN="${ADMIN_DOMAIN:-platform.knasoftware.com}"
              MARKETING_DOMAIN="${MARKETING_DOMAIN:-ai.knasoftware.com}"
              LANDING_DOMAIN="${LANDING_DOMAIN:-salon.knasoftware.com}"
              POS_DOMAIN="${POS_DOMAIN:-pos.knasoftware.com}"
              API_PORT="${API_PORT:-18089}"
              FRONTEND_PORT="${FRONTEND_PORT:-13088}"
              LANDING_PORT="${LANDING_PORT:-13090}"
              POS_CALENDAR_PORT="${POS_CALENDAR_PORT:-13091}"
              sed \
                -e "s#{{ADMIN_DOMAIN}}#${ADMIN_DOMAIN}#g" \
                -e "s#{{MARKETING_DOMAIN}}#${MARKETING_DOMAIN}#g" \
                -e "s#{{LANDING_DOMAIN}}#${LANDING_DOMAIN}#g" \
                -e "s#{{POS_DOMAIN}}#${POS_DOMAIN}#g" \
                -e "s#{{API_PORT}}#${API_PORT}#g" \
                -e "s#{{FRONTEND_PORT}}#${FRONTEND_PORT}#g" \
                -e "s#{{LANDING_PORT}}#${LANDING_PORT}#g" \
                -e "s#{{POS_CALENDAR_PORT}}#${POS_CALENDAR_PORT}#g" \
                "$template_dir/manleai.caddy.template" > "$caddy_output"
              sed \
                -e "s#{{ADMIN_DOMAIN}}#${ADMIN_DOMAIN}#g" \
                -e "s#{{MARKETING_DOMAIN}}#${MARKETING_DOMAIN}#g" \
                -e "s#{{LANDING_DOMAIN}}#${LANDING_DOMAIN}#g" \
                -e "s#{{POS_DOMAIN}}#${POS_DOMAIN}#g" \
                -e "s#{{API_PORT}}#${API_PORT}#g" \
                -e "s#{{FRONTEND_PORT}}#${FRONTEND_PORT}#g" \
                -e "s#{{LANDING_PORT}}#${LANDING_PORT}#g" \
                -e "s#{{POS_CALENDAR_PORT}}#${POS_CALENDAR_PORT}#g" \
                "$template_dir/manleai.edge-manifest.template" > "$manifest_output"
            )
          }

          restore_previous_edge() {
            if [ -z "$previous_caddy" ] || [ -z "$previous_manifest" ]; then
              echo "::error::The exact previous edge route is unavailable for rollback."
              return 1
            fi
            sudo -n project-edgectl upsert manleai "$previous_caddy" "$previous_manifest"
          }

          rollback_after_edge_cutover() {
            local edge_status=0
            local image_status=0
            restore_previous_edge || edge_status=$?
            rollback_release || image_status=$?
            [ "$edge_status" -eq 0 ] && [ "$image_status" -eq 0 ]
          }

          tmp_caddy="$(mktemp)"
          tmp_manifest="$(mktemp)"
          render_edge_bundle "$candidate_env" "$release_dir/deploy" "$tmp_caddy" "$tmp_manifest"

          if [ -n "$previous_release_dir" ]; then
            if [ ! -f "$previous_release_dir/deploy/manleai.caddy.template" ] || [ ! -f "$previous_release_dir/deploy/manleai.edge-manifest.template" ]; then
              echo "::error::The previous release does not contain edge templates for rollback."
              rollback_release
              exit 1
            fi
            previous_caddy="$(mktemp)"
            previous_manifest="$(mktemp)"
            render_edge_bundle "$previous_env" "$previous_release_dir/deploy" "$previous_caddy" "$previous_manifest"
          fi

          if ! sudo -n project-edgectl validate manleai "$tmp_caddy" "$tmp_manifest"; then
            echo "::error::Rendered ManleAI route failed project-edge validation."
            rollback_release
            exit 1
          fi

          if ! sudo -n project-edgectl upsert manleai "$tmp_caddy" "$tmp_manifest"; then
            restore_previous_edge || true
            rollback_release
            echo "::error::Project-edge upsert failed; restored the prior ManleAI route and application images."
            exit 1
          fi

          if ! bash "$release_dir/deploy/production-domain-smoke.sh" \
              "$ADMIN_DOMAIN" "$MARKETING_DOMAIN" "$LANDING_DOMAIN" "$POS_DOMAIN"; then
            echo "::error::Public domain smoke failed after edge cutover."
            rollback_after_edge_cutover || true
            exit 1
          fi

          if ! install -m 600 "$candidate_env" "$promoted_env" || ! mv -Tf "$promoted_env" "$active_env"; then
            echo "::error::Candidate project.env could not be promoted after public smoke."
            rollback_after_edge_cutover || true
            exit 1
          fi

          rm -f "$promoted_current"
          if ! ln -s "$release_dir" "$promoted_current" || ! mv -Tf "$promoted_current" "$DEPLOY_PATH/current"; then
            echo "::error::Candidate release could not be promoted after public smoke."
            if [ -n "$previous_env" ]; then
              install -m 600 "$previous_env" "$active_env" || true
            fi
            rollback_after_edge_cutover || true
            exit 1
          fi
          rm -f "$archive"
          REMOTE
          trap - ERR

      - name: Remove deployment SSH key
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/id_ed25519"
