name: Production Tenant Owner credential recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE_PRODUCTION_TENANT_OWNER_CREDENTIAL exactly
        required: true
        type: string
      approval_reference:
        description: Non-sensitive approved change reference
        required: true
        type: string
      expected_release_tag:
        description: Exact release tag currently running in production
        required: true
        type: string
      tenant_id:
        description: Exact salon UUID owned by the Tenant identity
        required: true
        type: string

concurrency:
  group: manleai-production-tenant-owner-credential-recovery
  cancel-in-progress: false

permissions:
  contents: read

env:
  RECOVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  RECOVERY_ACTION_KEY: production-tenant-owner-recovery-${{ github.run_id }}

jobs:
  rotate-tenant-owner-credential:
    name: Rotate the exact active Tenant Owner credential
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate approval and protected inputs
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TENANT_OWNER_EMAIL: ${{ secrets.TENANT_OWNER_RECOVERY_EMAIL }}
          TENANT_OWNER_PASSWORD: ${{ secrets.TENANT_OWNER_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "ROTATE_PRODUCTION_TENANT_OWNER_CREDENTIAL" ]; then
            echo "::error::The production Tenant owner recovery confirmation does not match."
            exit 1
          fi
          if [[ ! "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]] || \
             [[ ! "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || \
             [[ ! "$TENANT_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]] || \
             [ -z "$TENANT_OWNER_EMAIL" ] || [[ "$TENANT_OWNER_EMAIL" == *$'\n'* ]] || \
             [ "${#TENANT_OWNER_PASSWORD}" -lt 20 ] || [[ "$TENANT_OWNER_PASSWORD" == *$'\n'* ]]; then
            echo "::error::The production Tenant owner recovery metadata or secret is invalid."
            exit 1
          fi
          echo "::add-mask::$TENANT_OWNER_EMAIL"
          echo "::add-mask::$TENANT_OWNER_PASSWORD"
          for key in REMOTE_USER SERVER_IP SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing protected production recovery input: ${key}"
              exit 1
            fi
          done
          bash -n deploy/production-tenant-owner-credential-recovery.sh
          bash deploy/production-tenant-owner-credential-recovery-test.sh

      - name: Test and build protected access operator
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./cmd/platform-access ./modules/access
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/platform-access" ./cmd/platform-access
          chmod 700 "$RUNNER_TEMP/platform-access"

      - name: Prepare private recovery inputs
        env:
          TENANT_OWNER_EMAIL: ${{ secrets.TENANT_OWNER_RECOVERY_EMAIL }}
          TENANT_OWNER_PASSWORD: ${{ secrets.TENANT_OWNER_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/tenant-owner-recovery"
          install -d -m 700 "$private_dir"
          printf '%s' "$TENANT_OWNER_EMAIL" > "$private_dir/tenant-owner-email"
          printf '%s' "$TENANT_OWNER_PASSWORD" > "$private_dir/tenant-owner-password"
          chmod 600 "$private_dir/tenant-owner-email" "$private_dir/tenant-owner-password"

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Upload private recovery bundle
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/manleai-tenant-owner-recovery-$RECOVERY_ID"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$REMOTE_USER@$SERVER_IP" "install -d -m 700 '$remote_dir'"
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$RUNNER_TEMP/platform-access" \
            deploy/production-tenant-owner-credential-recovery.sh \
            deploy/production-account-audit.sh \
            "$RUNNER_TEMP/tenant-owner-recovery/tenant-owner-email" \
            "$RUNNER_TEMP/tenant-owner-recovery/tenant-owner-password" \
            "$REMOTE_USER@$SERVER_IP:$remote_dir/"

      - name: Apply production credential recovery
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          TENANT_ID: ${{ inputs.tenant_id }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/manleai-tenant-owner-recovery-$RECOVERY_ID"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            "$REMOTE_USER@$SERVER_IP" \
            "RECOVERY_ID='$RECOVERY_ID' EXPECTED_RELEASE_TAG='$EXPECTED_RELEASE_TAG' APPROVAL_REFERENCE='$APPROVAL_REFERENCE' RECOVERY_ACTION_KEY='$RECOVERY_ACTION_KEY' TENANT_ID='$TENANT_ID' bash '$remote_dir/production-tenant-owner-credential-recovery.sh'"

      - name: Remove remote recovery bundle
        if: ${{ always() }}
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set +e
          remote_dir="/tmp/manleai-tenant-owner-recovery-$RECOVERY_ID"
          if [ -s "$HOME/.ssh/id_ed25519" ] && [ -n "${REMOTE_USER:-}" ] && [ -n "${SERVER_IP:-}" ]; then
            ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$REMOTE_USER@$SERVER_IP" \
              "rm -f '$remote_dir/platform-access' '$remote_dir/production-tenant-owner-credential-recovery.sh' '$remote_dir/production-account-audit.sh' '$remote_dir/tenant-owner-email' '$remote_dir/tenant-owner-password' '$remote_dir/output/tenant-owner-recovery-result.json'; rmdir '$remote_dir/output' 2>/dev/null || true; rmdir '$remote_dir' 2>/dev/null || true"
          fi

      - name: Remove local recovery plaintext and SSH key
        if: ${{ always() }}
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/platform-access"
          rm -f "$RUNNER_TEMP/tenant-owner-recovery/tenant-owner-email" \
            "$RUNNER_TEMP/tenant-owner-recovery/tenant-owner-password"
          rmdir "$RUNNER_TEMP/tenant-owner-recovery" 2>/dev/null || true
