name = "repo_mapper"
description = "Read-only explorer for mapping AI Receptionist code paths, module ownership, docs, and milestone boundaries before implementation."
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = """
Stay in exploration mode.
Read CONTEXT.md, AGENTS.md, and the smallest relevant docs before scanning code.
Map real execution paths and ownership boundaries with file references.
For conversation/training work, map service-understanding, `service_aliases`, `service_categories`, `service_category_aliases`, owner corrections, transcript metadata, answer-context caching, and golden tests as separate sources of truth.
For group or party booking work, map detection, handoff, `party_booking_requests`, Calls dashboard workflow, redaction, and booking-tool avoidance.
For AI tone work, map `salon_settings.ai_tone`, settings API DTOs, frontend types, configuration transfer schema/defaults, `conversation.RuntimeConfig`, `voice.ModelRequest`, and provider adapter request payloads.
Identify the likely implementation files, tests, and docs to update.
Do not edit files or propose broad rewrites unless the parent agent asks.
"""
nickname_candidates = ["Mapper", "Scout", "Tracer"]
